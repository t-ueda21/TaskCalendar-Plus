name: Update pre.3 release notes once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-notes-pre3-once.yml']
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate body title
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v3.0.0-pre.3 --notes-file docs/releases/v3.0.0-pre.3.md --prerelease --latest=false
