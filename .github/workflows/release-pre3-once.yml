name: Verify v3.0.0-pre.3 manual release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-pre3-once.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify publication and unchanged stable feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $release = gh api "repos/$repo/releases/tags/v3.0.0-pre.3" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($release.draft -or -not $release.prerelease) { throw 'Expected published prerelease' }
          $expected = @('TaskCalendar+_3.0.0-pre.3_x64-setup.exe','TaskCalendar+_3.0.0-pre.3_x64-setup.exe.sig','TaskCalendar+_3.0.0-pre.3_x64-setup.zip')
          if (Compare-Object ($release.assets.name | Sort-Object) ($expected | Sort-Object)) { throw 'Unexpected assets' }
          $latest = gh api "repos/$repo/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($latest.id -ne 398080418 -or $latest.tag_name -ne 'v0.2.1') { throw 'Stable release changed' }
          $feed = Invoke-WebRequest "https://github.com/$repo/releases/latest/download/latest.json"
          $bytes = if ($feed.Content -is [byte[]]) { $feed.Content } else { [System.Text.Encoding]::UTF8.GetBytes($feed.Content) }
          $hash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([byte[]]$bytes)).ToLowerInvariant()
          if ($hash -ne 'fd1fdbc34c929aed8df4e3124e40ab1ef750fe82bfbdd615bb5a6ff98e920e81') { throw 'Stable feed changed' }
          gh release edit v3.0.0-pre.3 --notes-file docs/releases/v3.0.0-pre.3.md --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'PASS: published manual-only prerelease, three assets, v0.2.1 stable feed SHA256 unchanged'
