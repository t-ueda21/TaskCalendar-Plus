name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Outlook連携(COM)やテスト用の偽CLI(.cmd)がWindows前提のため、Windowsで実行する。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated renderer test browser
        shell: pwsh
        run: |
          $testDependencies = Join-Path $env:RUNNER_TEMP 'tcplus-test-dependencies'
          npm install --prefix $testDependencies --no-package-lock --no-save playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testModules = Join-Path $testDependencies 'node_modules'
          "TCPLUS_TEST_NODE_MODULES=$testModules" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          node (Join-Path $testModules 'playwright/cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: cargo test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: JavaScript syntax check (ES modules)
        shell: bash
        run: |
          for f in src-tauri/renderer/src/*.js; do
            if [ "$(basename "$f")" = "tauri-shell-bridge.js" ]; then
              node --check "$f"
            else
              node --input-type=module --check < "$f"
            fi
          done

      - name: node tests
        shell: pwsh
        run: |
          Get-ChildItem scripts/test-* -File | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $($_.Name)" }
          }

      - name: Build native app for AI work-time verification
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml

      - name: Native AI work-time flow without a model account
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TCPLUS_AI_NATIVE_DATA = Join-Path $env:RUNNER_TEMP 'taskcalendar-ai-native'
          $env:TCPLUS_CODEX_PATH = Join-Path $env:RUNNER_TEMP 'deliberately-missing-model.exe'
          $base = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2'
          $settings = @(
            @{Key='AdditionalBrowserArguments'; Value='--remote-debugging-port=9491'},
            @{Key='UserDataFolder'; Value=(Join-Path $env:TCPLUS_AI_NATIVE_DATA 'webview2')}
          )
          $previous = @()
          try {
            foreach ($setting in $settings) {
              $key = Join-Path $base $setting.Key
              New-Item -Path $key -Force | Out-Null
              $old = (Get-ItemProperty -LiteralPath $key).PSObject.Properties['taskcalendar-plus.exe']
              $previous += @{Key=$key; Exists=($null -ne $old); Value=$(if ($null -ne $old) {$old.Value} else {$null})}
              New-ItemProperty -LiteralPath $key -Name 'taskcalendar-plus.exe' -PropertyType String -Value $setting.Value -Force | Out-Null
            }
            node scripts/e2e-ai-worktime.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Native AI work-time verification failed' }
          } finally {
            foreach ($old in $previous) {
              if ($old.Exists) {
                New-ItemProperty -LiteralPath $old.Key -Name 'taskcalendar-plus.exe' -PropertyType String -Value $old.Value -Force | Out-Null
              } else {
                Remove-ItemProperty -LiteralPath $old.Key -Name 'taskcalendar-plus.exe' -ErrorAction SilentlyContinue
              }
            }
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-worktime-native
          path: out/ai-worktime-native/*
          if-no-files-found: ignore
