name: Windows packaged release verification

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      phase:
        type: choice
        options: [package, updates, diagnose, upload]
        default: package
      expected_sha:
        type: string
        required: false
      feed_sha:
        type: string
        required: false
      signature_sha:
        type: string
        required: false
      previous_sha:
        type: string
        required: false

permissions:
  contents: read

jobs:
  verify:
    if: inputs.phase == 'package' || inputs.phase == 'updates'
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERIFY_TAG: ${{ inputs.tag }}
      VERIFY_PHASE: ${{ inputs.phase }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PREVIOUS_SHA: ${{ inputs.previous_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: app-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44119887844
          name: taskcalendar-distribution
          path: ${{ runner.temp }}/current-distribution
      - name: Verify staged installer and download previous installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERIFY_TAG -ne 'v4.0.4') { throw 'Unexpected release tag' }
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-f]{64}$' -or $env:PREVIOUS_SHA -notmatch '^[0-9a-f]{64}$') { throw 'Expected verified SHA-256 values' }
          $current = Join-Path $env:RUNNER_TEMP 'current-distribution'
          $previous = Join-Path $env:RUNNER_TEMP 'previous-distribution'
          New-Item -ItemType Directory -Force $current,$previous | Out-Null
          gh release download v4.0.3 --repo $env:GITHUB_REPOSITORY --dir $previous --pattern '*_x64-setup.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $newFiles = @(Get-ChildItem -LiteralPath $current -File -Filter '*_x64-setup.exe')
          $oldFiles = @(Get-ChildItem -LiteralPath $previous -File -Filter '*_x64-setup.exe')
          if ($newFiles.Count -ne 1 -or $oldFiles.Count -ne 1) { throw 'Ambiguous installers' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $newFiles[0].FullName).Hash.ToLower() -ne $env:EXPECTED_SHA) { throw 'New installer hash mismatch' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $oldFiles[0].FullName).Hash.ToLower() -ne $env:PREVIOUS_SHA) { throw 'Previous installer hash mismatch' }
          "NEW_INSTALLER=$($newFiles[0].FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "OLD_INSTALLER=$($oldFiles[0].FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Ensure Microsoft WebView2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $locations = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application")
          $runtime = @($locations | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -File -Filter msedgewebview2.exe })
          if ($runtime.Count -eq 0) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Untrusted WebView2 bootstrapper' }
            $process = Start-Process -FilePath $bootstrapper -ArgumentList '/silent','/install' -Wait -PassThru
            if ($process.ExitCode -notin @(0,3010)) { throw "WebView2 installation failed: $($process.ExitCode)" }
          }
      - name: Install, upgrade and exercise the packaged app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'taskcalendar-installed'
          $oldCopy = Join-Path $env:RUNNER_TEMP 'taskcalendar-previous-copy'
          $taskProfile = Join-Path $env:RUNNER_TEMP 'taskcalendar-upgrade-profile'
          $report = Join-Path $env:GITHUB_WORKSPACE 'verification-report'
          New-Item -ItemType Directory -Force $report | Out-Null
          function Install-Checked([string]$file) {
            $process = Start-Process -FilePath $file -ArgumentList @('/S',"/D=$install") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          }
          function App-Exe([string]$folder) {
            $files = @(Get-ChildItem -LiteralPath $folder -File -Filter '*.exe' | Where-Object { $_.Name -notmatch '(?i)uninstall|webview|update' })
            if ($files.Count -ne 1) { throw 'Ambiguous installed app executable' }
            return $files[0].FullName
          }
          function Check-Native([string]$mode,[string]$exe,[string]$data) {
            node .github/release-verification/native-release-check.mjs $mode $exe $data $report
            if ($LASTEXITCODE -ne 0) { throw "Native check failed: $mode" }
          }
          Install-Checked $env:OLD_INSTALLER
          Copy-Item -LiteralPath $install -Destination $oldCopy -Recurse
          $oldExe = App-Exe $oldCopy
          if ($env:VERIFY_PHASE -eq 'package') {
            Check-Native 'seed' (App-Exe $install) $taskProfile
          }
          Install-Checked $env:NEW_INSTALLER
          $newExe = App-Exe $install
          $renderers = @(Get-ChildItem -LiteralPath $install -Directory -Recurse | Where-Object { $_.Name -eq 'renderer' -and (Test-Path (Join-Path $_.FullName 'assets/app.html')) })
          if ($renderers.Count -ne 1) { throw 'Packaged renderer not found' }
          $source = Join-Path $env:GITHUB_WORKSPACE 'app-source/src-tauri/renderer'
          $files = @(Get-ChildItem -LiteralPath $source -Recurse -File)
          foreach ($file in $files) {
            $relative = [System.IO.Path]::GetRelativePath($source,$file.FullName)
            $installed = Join-Path $renderers[0].FullName $relative
            if (-not (Test-Path -LiteralPath $installed)) { throw "Packaged source missing: $relative" }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $installed).Hash) { throw "Packaged source differs: $relative" }
          }
          @{rendererFiles=$files.Count;tag=$env:VERIFY_TAG;installerSha256=$env:EXPECTED_SHA;previousSha256=$env:PREVIOUS_SHA} | ConvertTo-Json | Set-Content (Join-Path $report 'package-hashes.json')
          if ($env:VERIFY_PHASE -eq 'package') {
            Check-Native 'package' $newExe $taskProfile
            Check-Native 'fresh' $newExe (Join-Path $env:RUNNER_TEMP 'taskcalendar-fresh-profile')
          } elseif ($env:VERIFY_PHASE -eq 'updates') {
            Check-Native 'updates-old' $oldExe (Join-Path $env:RUNNER_TEMP 'taskcalendar-old-update-profile')
            Check-Native 'updates-new' $newExe (Join-Path $env:RUNNER_TEMP 'taskcalendar-new-update-profile')
          } else { throw 'Unknown verification phase' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-verification-${{ inputs.phase }}
          path: verification-report/*
          if-no-files-found: warn

  diagnose:
    if: inputs.phase == 'diagnose'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .github/release-verification/model-diagnostic
          cache-on-failure: true
      - name: Run the unchanged model tests in isolation
        shell: pwsh
        run: |
          cargo test --locked --manifest-path .github/release-verification/model-diagnostic/Cargo.toml -- --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce fake Claude CLI pipe exchange
        if: always()
        shell: pwsh
        run: |
          rustc --edition=2024 .github/release-verification/diagnose-fixture.rs -o fixture-diagnostic.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./fixture-diagnostic.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  upload:
    if: inputs.phase == 'upload'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      VERIFY_TAG: ${{ inputs.tag }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      FEED_SHA: ${{ inputs.feed_sha }}
      SIGNATURE_SHA: ${{ inputs.signature_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44119887844
          name: taskcalendar-distribution
          path: ${{ runner.temp }}/signed-distribution
      - name: Verify signed build bytes and upload draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERIFY_TAG -ne 'v4.0.4') { throw 'Unexpected release tag' }
          foreach ($hash in @($env:EXPECTED_SHA,$env:FEED_SHA,$env:SIGNATURE_SHA)) {
            if ($hash -notmatch '^[0-9a-f]{64}$') { throw 'Expected verified SHA-256 values' }
          }
          $folder = Join-Path $env:RUNNER_TEMP 'signed-distribution'
          $expected = @{
            'TaskCalendar+_4.0.4_x64-setup.exe' = $env:EXPECTED_SHA
            'TaskCalendar+_4.0.4_x64-setup.exe.sig' = $env:SIGNATURE_SHA
            'latest.json' = $env:FEED_SHA
          }
          if (@(Get-ChildItem -LiteralPath $folder -File).Count -ne 3) { throw 'Unexpected artifact files' }
          foreach ($name in $expected.Keys) {
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $folder $name)).Hash.ToLowerInvariant() -ne $expected[$name]) { throw "Staged artifact mismatch: $name" }
          }
          python -c "import sys,pathlib,zipfile; p=pathlib.Path(sys.argv[1]); n='TaskCalendar+_4.0.4_x64-setup.exe'; z=zipfile.ZipFile(p/'TaskCalendar+_4.0.4_x64-setup.zip','x',zipfile.ZIP_DEFLATED,compresslevel=9); z.write(p/n,arcname=n); z.close()" $folder
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view $env:VERIFY_TAG --repo $env:GITHUB_REPOSITORY --json isDraft,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft -or $release.tagName -ne $env:VERIFY_TAG) { throw 'Refusing to overwrite a published or different release' }
          $assets = @('TaskCalendar+_4.0.4_x64-setup.exe','TaskCalendar+_4.0.4_x64-setup.exe.sig','TaskCalendar+_4.0.4_x64-setup.zip','latest.json') | ForEach-Object { Join-Path $folder $_ }
          gh release upload $env:VERIFY_TAG --repo $env:GITHUB_REPOSITORY @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets | ForEach-Object { Get-FileHash -Algorithm SHA256 -LiteralPath $_ } | Format-Table -AutoSize
