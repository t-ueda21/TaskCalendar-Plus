name: Windows packaged release verification
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      phase:
        type: choice
        options: [package, updates]
        default: package
      build_run:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      expected_sha:
        type: string
        required: true
      previous_sha:
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERIFY_TAG: ${{ inputs.tag }}
      VERIFY_PHASE: ${{ inputs.phase }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PREVIOUS_SHA: ${{ inputs.previous_sha }}
      BUILD_RUN: ${{ inputs.build_run }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: app-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard release source and build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:VERIFY_TAG -ne 'v4.0.5') { throw 'Unexpected release tag' }
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:BUILD_RUN -notmatch '^\d+$') { throw 'Invalid build identity' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' -or $run.head_sha -ne $env:SOURCE_SHA) { throw 'Build is not the successful release source' }
          $tagSha = git -C app-source rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:SOURCE_SHA) { throw 'Tag source differs from build' }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: taskcalendar-distribution
          path: ${{ runner.temp }}/current-distribution
      - name: Check installer hashes and download previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-f]{64}$' -or $env:PREVIOUS_SHA -notmatch '^[0-9a-f]{64}$') { throw 'Expected verified SHA-256 values' }
          $previous = Join-Path $env:RUNNER_TEMP 'previous-distribution'
          New-Item -ItemType Directory -Force $previous | Out-Null
          gh release download v4.0.4 --repo $env:GITHUB_REPOSITORY --dir $previous --pattern '*_x64-setup.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $newFiles = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'current-distribution') -File -Filter '*_x64-setup.exe')
          $oldFiles = @(Get-ChildItem $previous -File -Filter '*_x64-setup.exe')
          if ($newFiles.Count -ne 1 -or $oldFiles.Count -ne 1) { throw 'Ambiguous installers' }
          if ((Get-FileHash $newFiles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:EXPECTED_SHA) { throw 'New installer hash differs' }
          if ((Get-FileHash $oldFiles[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PREVIOUS_SHA) { throw 'Previous installer hash differs' }
          "NEW_INSTALLER=$($newFiles[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OLD_INSTALLER=$($oldFiles[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Ensure Microsoft WebView2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $locations = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application")
          $runtime = @($locations | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem -LiteralPath $_ -Recurse -File -Filter msedgewebview2.exe })
          if ($runtime.Count -eq 0) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Untrusted WebView2 bootstrapper' }
            $process = Start-Process -FilePath $bootstrapper -ArgumentList '/silent','/install' -Wait -PassThru
            if ($process.ExitCode -notin @(0,3010)) { throw "WebView2 installation failed: $($process.ExitCode)" }
          }
      - name: Install, upgrade and exercise exact packaged app
        shell: pwsh
        run: ./.github/release-verification/verify-installed.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-verification-${{ inputs.phase }}
          path: |
            verification-report/*
            out/ai-worktime-native/*
          if-no-files-found: warn
