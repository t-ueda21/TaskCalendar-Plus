# Renderer checks retain asynchronous settings operations until completion.
name: Publish v3.0.1 stable once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v301-once.yml']

permissions:
  contents: read

concurrency:
  group: release-v3.0.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v3.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated renderer test browser
        shell: pwsh
        run: |
          $testDependencies = Join-Path $env:RUNNER_TEMP 'tcplus-test-dependencies'
          npm install --prefix $testDependencies --no-package-lock --no-save playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testModules = Join-Path $testDependencies 'node_modules'
          "TCPLUS_TEST_NODE_MODULES=$testModules" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          node (Join-Path $testModules 'playwright/cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate version
        run: node scripts/release-manifest.mjs --check
      - name: Test
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem scripts/test-* -File | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $($_.Name)" }
          }
      - name: Build signed updater installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2.11.5 build --ci --bundles nsis -- --locked
      - name: Verify packaged renderer matches tested source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'src-tauri/target/release/bundle/nsis/TaskCalendar+_3.0.1_x64-setup.exe'
          $package = Join-Path $env:RUNNER_TEMP 'tcplus-v301-package'
          & "$env:ProgramFiles/7-Zip/7z.exe" x $installer "-o$package" -y | Out-File (Join-Path $env:RUNNER_TEMP 'package-extraction.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = (Resolve-Path src-tauri/renderer).Path
          $files = @(Get-ChildItem -LiteralPath $source -Recurse -File)
          foreach ($file in $files) {
            $relative = [IO.Path]::GetRelativePath($source,$file.FullName)
            $packed = Join-Path (Join-Path $package 'renderer') $relative
            if (-not (Test-Path -LiteralPath $packed)) { throw "Missing packaged renderer: $relative" }
            if ((Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $packed).Hash) { throw "Packaged renderer differs: $relative" }
          }
          if (-not (Test-Path (Join-Path $package 'taskcalendar-plus.exe'))) { throw 'Packaged application missing' }
          Write-Output "PASS: all $($files.Count) packaged renderer files match tested source"
      - name: Create stable update feed (skip prereleases)
        run: node scripts/release-manifest.mjs
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetJson = node scripts/release-manifest.mjs --assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = @($assetJson | ConvertFrom-Json)
          $feedPath = $assets | Where-Object { $_ -match 'latest\.json$' }
          if ($assets.Count -ne 3 -or -not $feedPath) { throw 'Expected installer, signature, update feed' }
          $feed = Get-Content -LiteralPath $feedPath -Raw | ConvertFrom-Json
          if ($feed.version -ne '3.0.1' -or -not $feed.platforms.'windows-x86_64'.signature) { throw 'Invalid stable feed' }
          $zip = Join-Path $env:RUNNER_TEMP 'TaskCalendar+_3.0.1_x64-setup.zip'
          Compress-Archive -LiteralPath @($assets | Where-Object { $_ -notmatch 'latest\.json$' }) -DestinationPath $zip -Force
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to overwrite published release' }
          } else {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --draft --title "TaskCalendar+ $env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG @assets $zip --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($latest.tag_name -ne $env:RELEASE_TAG -or $latest.prerelease -or $latest.draft) { throw 'Latest release mismatch' }
          $publicFeed = Invoke-RestMethod "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
          if ($publicFeed.version -ne '3.0.1' -or $publicFeed.platforms.'windows-x86_64'.signature -cne $feed.platforms.'windows-x86_64'.signature) { throw 'Published update feed mismatch' }
          Write-Output 'PASS: stable v3.0.1 published as Latest with matching updater feed'
